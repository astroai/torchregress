name: Docs

# Builds the zensical site on every push to main and publishes it to GitHub
# Pages (https://astroai.github.io/torchregress/). One-time setup in the
# repository: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0
      - name: Build docs
        run: pixi run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Forks build the site but do not publish it.
    if: github.repository == 'astroai/torchregress'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
