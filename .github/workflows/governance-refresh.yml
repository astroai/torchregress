name: Governance Refresh

on:
  workflow_dispatch:
    inputs:
      run_full_profile:
        description: "Run full example profile and strict threshold checks"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: governance-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-governance:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Render comparison summaries (smoke + audit)
        run: |
          uv run python tools/render_example_summaries.py --profile smoke
          uv run python tools/render_example_summaries.py --profile audit

      - name: Render comparison summaries (full)
        if: github.event_name == 'schedule' || inputs.run_full_profile == true
        run: |
          uv run python tools/render_example_summaries.py --profile full

      - name: Compare audit vs full summary profiles
        if: github.event_name == 'schedule' || inputs.run_full_profile == true
        run: |
          uv run python tools/compare_example_summary_profiles.py \
            --base-dir reports/example_summaries \
            --source-profile audit \
            --target-profile full \
            --output reports/example_summaries/profile_comparison_audit_vs_full.json

      - name: Check example thresholds (CI conservative)
        if: github.event_name == 'schedule' || inputs.run_full_profile == true
        run: |
          uv run python tools/example_summary_thresholds.py \
            --base-dir reports/example_summaries \
            --profile full \
            --threshold-profile ci_conservative \
            --write-thresholds reports/example_summaries/thresholds_full.json \
            --thresholds reports/example_summaries/thresholds_full.json \
            --output-verdict reports/example_summaries/threshold_check_full_latest.json \
            --fail-on-thresholds

      - name: Check example thresholds (review strict)
        if: github.event_name == 'schedule' || inputs.run_full_profile == true
        run: |
          uv run python tools/example_summary_thresholds.py \
            --base-dir reports/example_summaries \
            --profile full \
            --threshold-profile review_strict \
            --write-thresholds reports/example_summaries/thresholds_full_review_strict.json \
            --thresholds reports/example_summaries/thresholds_full_review_strict.json \
            --output-verdict reports/example_summaries/threshold_check_full_review_strict_latest.json \
            --runtime-multiplier 6.0 \
            --runtime-floor 0.35 \
            --metric-multiplier 3.0 \
            --metric-floor 0.2 \
            --prob-delta 0.25 \
            --r2-delta 1.0 \
            --fail-on-thresholds

      - name: Benchmark threshold checks (CPU)
        run: |
          uv run python -m tools.benchmark_smoke \
            --mode smoke \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/smoke.json \
            --fail-on-thresholds
          uv run python -m tools.benchmark_smoke \
            --mode sweep \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/sweep.json \
            --fail-on-thresholds

      - name: Render benchmark markdown summaries
        run: |
          uv run python -m tools.benchmark_report_summary \
            reports/benchmark_smoke_latest.json \
            --output reports/benchmark_smoke_latest.md
          uv run python -m tools.benchmark_report_summary \
            reports/benchmark_sweep_latest.json \
            --group-by-name \
            --output reports/benchmark_sweep_latest.md

      - name: Render method catalog and comparative evidence
        run: |
          uv run python tools/render_method_catalog.py \
            --markdown-out docs/reports/method_catalog_generated.md \
            --json-out reports/method_catalog_latest.json \
            --update-method-matrix docs/guide/method-selection.md \
            --comparative-evidence-md-out docs/reports/comparative_evidence_matrix.md \
            --comparative-evidence-json-out reports/comparative_evidence_matrix_latest.json

      - name: Render real-data recommendation guide
        run: |
          uv run python -m tools.render_realdata_recommendation_guide \
            --doc docs/reports/real_data_recommendation_guide.md \
            --comparative-json reports/comparative_evidence_matrix_latest.json

      - name: Run adoption audit and render review packet
        run: |
          uv run python tools/adoption_audit.py \
            --json reports/adoption_readiness_2026-02-25.json \
            --print-summary
          uv run python tools/render_review_packet.py

      - name: Upload governance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-refresh-artifacts
          path: |
            reports/*.json
            reports/*.md
            reports/example_summaries/*.json
            reports/example_summaries/*.md
            docs/reports/comparative_evidence_matrix.md
            docs/guide/method-selection.md
            docs/reports/method_catalog_generated.md
            docs/reports/real_data_recommendation_guide.md
            docs/reports/audits/review_readiness_packet_*.md
          if-no-files-found: warn
