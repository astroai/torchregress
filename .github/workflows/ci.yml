name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Cache pip and venv
      uses: actions/cache@v4
      with:
        # Cache pip wheel downloads
        path: |
          ~/.cache/pip
          .venv
          .uv-cache
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Create uv virtual environment
      run: |
        uv venv

    - name: Install dependencies (via uv)
      run: |
        # We need to install torch first to determine its version, which is required to find
        # the correct PyG wheels. We use the CPU-only wheel index for torch.
        uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Determine the torch version and construct the PyG index URL.
        TORCH_VER=$(uv run python -c "import torch,sys; print(torch.__version__.split('+')[0])")
        PYG_INDEX="https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
        # Install the project with test dependencies. `torchcp` is a project dependency that
        # requires torch-geometric, which in turn requires torch-scatter, etc.
        # We use --find-links to point to the correct PyG wheels.
        uv pip install --no-build-isolation --find-links ${PYG_INDEX} -e ".[test]"
    - name: Run tests
      run: |
        uv run pytest --cov=torchregress
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Cache pip and uv-cache (lint)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          .uv-cache
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Create uv virtual environment
      run: |
        uv venv

    - name: Install dependencies (via uv)
      run: |
        # For linting we only need dev dependencies; no heavy binary preinstalls are done here.
        uv pip install -e ".[dev]"

    - name: Run linting
      run: |
        uv run ruff check .
        uv run black --check .
