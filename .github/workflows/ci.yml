name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: latest
      - name: Run lint
        run: pixi run lint
      - name: Run mypy
        run: pixi run mypy
      - name: Run tests
        run: pixi run test
