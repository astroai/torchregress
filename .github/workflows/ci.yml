name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: pip install "pre-commit>=4,<5"
      - name: Run pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure --color always

  lint-test:
    needs: pre-commit
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_FOR_PRIVATE_REPOS }}@github.com/".insteadOf "https://github.com/"
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0

      - name: Test with coverage
        run: pixi run pytest --cov=torchregress --cov-report=xml --cov-report=term

      - name: Docs API drift smoke (quickstart workflows)
        if: (!cancelled())
        run: pixi run pytest tests/test_docs_snippets_smoke.py::test_quickstart_workflows_run_without_errors -xvs

      - name: Type-check (mypy)
        run: pixi run mypy src/torchregress

      - name: Build docs
        run: pixi run zensical build --strict

      - name: CPU benchmark smoke (thresholds)
        run: |
          pixi run python -m tools.benchmark_smoke \
            --mode smoke \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/smoke.json \
            --fail-on-thresholds

      - name: CPU benchmark sweep (thresholds)
        run: |
          pixi run python -m tools.benchmark_smoke \
            --mode sweep \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/sweep.json \
            --fail-on-thresholds
