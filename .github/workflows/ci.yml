name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Install test dependencies
      run: |
        uv sync --extra test --extra flows

    - name: Run tests
      run: |
        uv run python -m pytest --cov=torchregress --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      timeout-minutes: 5
      with:
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Install lint dependencies
      run: |
        uv sync --extra dev

    - name: Run ruff
      run: |
        uv run ruff check \
          torchregress/losses/nflows.py \
          torchregress/algorithms/rc.py \
          tests/algorithms/test_rc.py \
          tests/test_optional_flow_behavior.py \
          tests/test_public_api_contracts.py

    - name: Run black
      run: |
        uv run black --check \
          torchregress/losses/nflows.py \
          torchregress/algorithms/rc.py \
          tests/algorithms/test_rc.py \
          tests/test_optional_flow_behavior.py \
          tests/test_public_api_contracts.py

  benchmark-thresholds-cpu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Install benchmark dependencies
      run: |
        uv sync --extra test --extra flows

    - name: Run benchmark smoke threshold check (CPU)
      env:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
      run: |
        uv run python -m tools.benchmark_smoke \
          --mode smoke \
          --iterations 2 \
          --warmup 1 \
          --device cpu \
          --thresholds reports/benchmark_thresholds/cpu/smoke.json \
          --fail-on-thresholds

    - name: Run benchmark sweep threshold check (CPU)
      env:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
      run: |
        uv run python -m tools.benchmark_smoke \
          --mode sweep \
          --iterations 2 \
          --warmup 1 \
          --device cpu \
          --thresholds reports/benchmark_thresholds/cpu/sweep.json \
          --fail-on-thresholds

    - name: Upload benchmark artifacts (CPU)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-cpu-reports
        path: |
          reports/benchmark_smoke_latest.json
          reports/benchmark_sweep_latest.json
        if-no-files-found: warn

    - name: Render benchmark markdown summaries (CPU)
      if: always()
      run: |
        uv run python -m tools.benchmark_report_summary reports/benchmark_smoke_latest.json --output reports/benchmark_smoke_latest.md
        uv run python -m tools.benchmark_report_summary reports/benchmark_sweep_latest.json --group-by-name --output reports/benchmark_sweep_latest.md

    - name: Upload benchmark markdown summaries (CPU)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-cpu-summaries
        path: |
          reports/benchmark_smoke_latest.md
          reports/benchmark_sweep_latest.md
        if-no-files-found: warn

    - name: Render review readiness packet
      if: always()
      run: |
        uv run python tools/render_review_packet.py

    - name: Upload review readiness packet artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: review-readiness-packet
        path: |
          reports/review_readiness_packet_latest.json
          docs/audits/review_readiness_packet_2026-02-26.md
        if-no-files-found: warn

    # CUDA benchmark thresholds can be added later when a stable GPU runner is available.
    # Suggested future job:
    # - run tools.benchmark_smoke --mode smoke/sweep --device cuda
    # - compare against reports/benchmark_thresholds/cuda/sweep.json

  flow-examples-optional:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"

    - name: Install flow example dependencies
      run: |
        uv sync --extra test --extra flows

    - name: Run flow-enabled example smoke tests
      run: |
        uv run python -m pytest -q \
          tests/test_examples_smoke.py::test_normalizing_flows_multitarget_main_smoke \
          tests/test_examples_smoke.py::test_multimodal_method_comparison_main_smoke

    - name: Render comparison example summaries (audit profile)
      run: |
        uv run python tools/render_example_summaries.py --profile audit

    - name: Render comparison example summaries (full profile)
      run: |
        uv run python tools/render_example_summaries.py --profile full

    - name: Compare audit vs full example summary profiles
      run: |
        uv run python tools/compare_example_summary_profiles.py \
          --base-dir reports/example_summaries \
          --source-profile audit \
          --target-profile full \
          --output reports/example_summaries/profile_comparison_audit_vs_full.json

    - name: Check full-profile example summary thresholds
      run: |
        uv run python tools/example_summary_thresholds.py \
          --base-dir reports/example_summaries \
          --profile full \
          --thresholds reports/example_summaries/thresholds_full.json \
          --output-verdict reports/example_summaries/threshold_check_full_latest.json \
          --fail-on-thresholds

    - name: Upload comparison example summary artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: comparison-example-summaries
        path: |
          reports/example_summaries/*.json
          reports/example_summaries/*.md
        if-no-files-found: warn
