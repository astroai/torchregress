name: CI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Cache pip and venv
      uses: actions/cache@v4
      with:
        # Cache pip wheel downloads
        path: |
          ~/.cache/pip
          .venv
          .uv-cache
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Create uv virtual environment
      run: |
        uv venv

    - name: Install dependencies (via uv)
      run: |
        # Ensure a CPU-only PyTorch wheel is installed inside the uv venv so binary deps
        # that rely on torch can be satisfied. We install PyTorch from the CPU wheel index.
        uv pip install --index-url https://download.pytorch.org/whl/cpu torch
        # Install PyG wheels that match the installed torch version (CPU).
        # Construct the PyG wheel index for the detected torch version and install
        # the PyG binary packages required by torchcp.
        TORCH_VER=$(uv run python -c "import torch,sys; print(torch.__version__.split('+')[0])")
        echo "Detected torch version: ${TORCH_VER}"
        PYG_INDEX="https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
        echo "Using PyG index: ${PYG_INDEX}"
        # Install core PyG binary packages from the PyG index; fail if unavailable.
        uv pip install -f "${PYG_INDEX}" --no-deps torch-scatter torch-sparse torch-cluster torch-spline-conv
        # Install torch-geometric itself (it will pull from the same index)
        uv pip install -f "${PYG_INDEX}" torch-geometric
        # Finally install project and test extras from pyproject.toml using uv (reads pyproject)
        uv pip install -e ".[test]"
    - name: Save .venv to cache
      if: always()
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-venv-${{ matrix.python-version }}-
          ${{ runner.os }}-venv-
        
    - name: Run tests
      run: |
        pytest --cov=torchregress
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Cache pip and uv-cache (lint)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          .uv-cache
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Create uv virtual environment
      run: |
        uv venv

    - name: Install dependencies (via uv)
      run: |
        # For linting we only need dev dependencies; no heavy binary preinstalls are done here.
        uv pip install -e ".[dev]"
    - name: Ensure linting tools available
      run: |
        # Make sure ruff and black are installed in the uv venv (redundant but safe)
        uv pip install ruff black || true

    - name: Run linting
      run: |
        # Try to auto-fix with ruff first, then check formatting with black.
        uv run ruff --fix . || true
        # black --check will fail if files need formatting. If so, commit & push the fixes.
        if uv run black --check .; then
          echo "Formatting OK"
        else
          uv run black .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(ci): auto-format with ruff and black" || echo "no changes to commit"
          git push origin main
        fi
