name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: pip install "pre-commit>=4,<5"
      - name: Run pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure --color always


  # Python-version matrix: pixi pins one env, so these legs install via pip and
  # run pytest directly. The `lint-test` job below remains the primary ubuntu job.
  # No GPU leg (assumption A3): no self-hosted GPU runner is guaranteed.
  test-matrix:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: pip install -e ".[test,viz]"
      - name: Run tests
        run: pytest -q

  lint-test:
    needs: pre-commit
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0

      - name: Lint
        run: pixi run lint

      - name: Type-check
        run: pixi run typecheck

      - name: Test with coverage
        run: pixi run test

      - name: Docs API drift smoke (quickstart workflows)
        if: (!cancelled())
        run: pixi run pytest tests/test_docs_snippets_smoke.py::test_quickstart_workflows_run_without_errors -xvs

      - name: Build docs
        run: pixi run docs

      - name: CPU benchmark smoke (thresholds)
        run: |
          pixi run python -m tools.benchmark_smoke \
            --mode smoke \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/smoke.json \
            --fail-on-thresholds

      - name: CPU benchmark sweep (thresholds)
        run: |
          pixi run python -m tools.benchmark_smoke \
            --mode sweep \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/sweep.json \
            --fail-on-thresholds
