name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.73.0
          environments: release

      - name: Verify tag matches pyproject.toml
        run: pixi run --environment release python scripts/release/verify_version.py --tag "${{ github.ref_name }}"

      - name: Build package
        run: pixi run --environment release build

      - name: Validate artifacts
        run: ./scripts/release/build_package.sh --check-only

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
