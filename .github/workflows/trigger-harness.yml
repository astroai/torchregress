name: Trigger Harness Parity

on:
  push:
    branches: [main]
    paths:
      - "src/torchregress/**"
      - "pyproject.toml"
      - "pixi.toml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to torchregress-harness
        run: |
          curl -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PAT_FOR_PRIVATE_REPOS }}" \
            https://api.github.com/repos/astroai/torchregress-harness/dispatches \
            -d '{"event_type":"torchregress-push","client_payload":{"sha":"${{ github.sha }}"}}' || echo "dispatch failed (no PAT or repo private) — ignored"
