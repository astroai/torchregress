name: Docs Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: docs-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Benchmark threshold checks (CPU)
        run: |
          uv run python -m tools.benchmark_smoke \
            --mode smoke \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/smoke.json \
            --fail-on-thresholds
          uv run python -m tools.benchmark_smoke \
            --mode sweep \
            --iterations 2 \
            --warmup 1 \
            --device cpu \
            --thresholds reports/benchmark_thresholds/cpu/sweep.json \
            --fail-on-thresholds

      - name: Render method catalog and comparative evidence
        run: |
          uv run python tools/render_method_catalog.py \
            --markdown-out docs/reports/method_catalog_generated.md \
            --json-out reports/method_catalog_latest.json \
            --update-method-matrix docs/guide/method-selection.md \
            --comparative-evidence-md-out docs/reports/comparative_evidence_matrix.md \
            --comparative-evidence-json-out reports/comparative_evidence_matrix_latest.json

      - name: Render real-data recommendation guide
        run: |
          uv run python -m tools.render_realdata_recommendation_guide \
            --doc docs/reports/real_data_recommendation_guide.md \
            --comparative-json reports/comparative_evidence_matrix_latest.json

      - name: Upload refreshed docs artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-refresh-artifacts
          path: |
            reports/method_catalog_latest.json
            reports/comparative_evidence_matrix_latest.json
            docs/reports/comparative_evidence_matrix.md
            docs/reports/method_catalog_generated.md
            docs/reports/real_data_recommendation_guide.md
            docs/guide/method-selection.md
          if-no-files-found: warn
