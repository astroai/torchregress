# ============================================================================
# torchregress — Zensical configuration
# Native Zensical (no mkdocs). See CONTRIBUTING.md and AGENTS.md.
# ============================================================================

[project]

# ─── Site identity ─────────────────────────────────────────────────────────
site_name = "torchregress"
site_description = "PyTorch library for regression, uncertainty quantification, and robust estimation — losses, metrics, methods, and algorithms."
site_author = "Sébastien Fabbro"
site_url = "https://astroai.github.io/torchregress/"
copyright = """
Copyright &copy; 2024–2026 Sébastien Fabbro · Licensed under the
<a href="https://opensource.org/licenses/MIT" rel="noopener" target="_blank">MIT License</a>.
"""

# ─── Branding ──────────────────────────────────────────────────────────────
# Paths are relative to the docs/ directory (Zensical's content root)
favicon = "assets/images/favicon.svg"
logo = "assets/images/logo.svg"
repo_url = "https://github.com/astroai/torchregress"
repo_name = "astroai/torchregress"
edit_uri = "edit/main/docs/"

# ─── Extra assets ──────────────────────────────────────────────────────────
extra_css = [
  "stylesheets/extra.css",
]
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/mermaid.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

# ─── Icon set ─────────────────────────────────────────────────────────────
# Enable Material Design Icons (used in :material-…: shorthands in Markdown)
[project.theme.icon.admonition]
default = "material/alert"
note = "material/note-text"
abstract = "material/clipboard-text"
info = "material/information"
tip = "material/lightbulb-on"
success = "material/check-circle"
question = "material/help-circle"
warning = "material/alert"
failure = "material/close-circle"
danger = "material/skull"
bug = "material/bug"
example = "material/test-tube"
quote = "material/format-quote-open"

# ─── Social links ──────────────────────────────────────────────────────────
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/sfabbro/torchregress"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/torchregress/"

# ============================================================================
# Theme configuration — "modern" (next-gen) variant
# ============================================================================
[project.theme]
variant = "modern"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "search.share",
  "toc.follow",
]

# ─── Announcement bar (dismissible) ────────────────────────────────────────
[project.theme.announce]
content = "⭐ <strong>torchregress 0.1.0</strong> — now using <strong>Zensical</strong>. If you spot anything off, please <a href='https://github.com/sfabbro/torchregress/issues'>open an issue</a>."

# ─── Logo icon (fallback when logo image is not set) ───────────────────────
[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "lucide/trending-up"

# ─── Fonts ────────────────────────────────────────────────────────────────
[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# ─── Color palette — Indigo (primary) / Amber (accent) ────────────────────
# Auto light: default scheme when OS prefers light
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Auto dark: slate scheme when OS prefers dark
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Manual override: always-available toggles, no media query
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

