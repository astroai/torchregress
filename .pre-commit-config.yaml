repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(torchregress|tests|tools)/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^(torchregress|tests|tools)/

  - repo: local
    hooks:
      - id: ci-local-parity
        name: CI parity (pytest + CPU benchmarks; mirrors GitHub Actions)
        entry: bash scripts/ci_local.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
