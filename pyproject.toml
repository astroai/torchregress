[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress"
version = "0.1.0"
description = "PyTorch loss functions and utilities for regression problems."
readme = "README.md"
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "machine learning", "deep learning", "loss functions"]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "torchmetrics>=1.0.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.60.0",
    "zuko>=1.4.0",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress"
"Bug Tracker" = "https://github.com/sfabbro/torchregress/issues"
"Documentation" = "https://github.com/sfabbro/torchregress#readme"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
    "pymdown-extensions>=10.0.0",
]
conformal = [
    "torchcp>=1.2.0",
    "torchsort>=0.1.10",
    "torch-geometric>=2.7.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-cluster>=1.6.3",
    "torch-spline-conv>=1.2.2",
    "transformers>=4.40.0",
]
all = ["torchregress[test,dev,docs,conformal]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["torchregress*"]

[tool.setuptools.package-data]
torchregress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torchcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torchmetrics.*"
ignore_missing_imports = true

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch", "setuptools"]
torch-scatter = ["torch", "setuptools"]
torch-sparse = ["torch", "setuptools"]
torch-spline-conv = ["torch", "setuptools"]
