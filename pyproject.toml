[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress"
version = "0.1.0"
description = "PyTorch loss functions and utilities for regression problems."
readme = "README.md"
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "machine learning", "deep learning", "loss functions"]
dependencies = [
    "torch>=2.4.0",
    "numpy>=2.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "torchmetrics>=1.4.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress"
"Bug Tracker" = "https://github.com/sfabbro/torchregress/issues"
"Documentation" = "https://github.com/sfabbro/torchregress#readme"

[project.scripts]
torchregress-health = "torchregress.health:check_health"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "polars>=0.20.0",
    "pyarrow>=18.0.0",
    "PyYAML>=6.0.0",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.7.0",
]
conformal = []
flows = [
    "zuko>=1.6.0",
]
clauds = [
    "polars>=0.20.0",
    "astropy>=6.0.0",
    "pyarrow>=18.0.0",
]
# TabReD fetch + wide-tabular probe (Polars/Kaggle/loguru align with yandex-research/tabred)
tabred = [
    "polars>=0.20.0",
    "pyarrow>=18.0.0",
    "kaggle>=1.6.0",
    "loguru>=0.7.0",
    "scikit-learn>=1.5.0",
]
foundation-models = [
    "tabpfn>=0.1.9",
]
external = [
    "mapie>=1.0.0",
    "scikit-lego>=0.7.0",
    "botorch>=0.11.0",
    "gpytorch>=1.11.0",
    "crepes>=0.4.0",
    "torchcp>=0.1.0",
]
all = ["torchregress[test,dev,docs,conformal,flows,foundation-models,external]"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["torchregress*"]

[tool.setuptools.package-data]
torchregress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.uv-cache
  | \.pytest_cache
  | \.ruff_cache
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
"docs/*" = ["E501"]
"tools/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = ["examples", "tools", "docs", "scripts"]

[[tool.mypy.overrides]]
module = ["examples.*", "tools.*", "docs.*", "tests.*", "scripts.*", "torchregress.viz.results", "torchregress.test_time.transport", "torchregress.losses.balanced_mse", "torchregress.algorithms.rc", "torchregress.utils.scaling"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "torchregress.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "matplotlib.*",
    "pandas.*",
    "torchmetrics.*",
    "scipy.*",
    "sklearn.*",
    "requests.*",
    "zuko.*",
    "tqdm.*",
    "numpy.*",
]
ignore_missing_imports = true

# pytest-cov configuration (consumed by `uv run pytest --cov=...` and Codecov).
# Mirrors the codecov.yml ignore list so local runs match CI reports.
[tool.coverage.run]
branch = false
source = ["torchregress"]
omit = [
    "src/torchregress/__init__.py",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "\\.\\.\\.",
]
