[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress"
version = "0.1.0"
description = "PyTorch loss functions and utilities for regression problems."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {file = "LICENSE"}
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "machine learning", "deep learning", "loss functions"]
dependencies = [
    "torch",
    "numpy",
    "torchmetrics",
    "scipy",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress"
"Bug Tracker" = "https://github.com/sfabbro/torchregress/issues"
"Documentation" = "https://sfabbro.github.io/torchregress/"

[project.scripts]
torchregress-health = "torchregress.health:check_health"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "polars",
    "pyarrow",
    "PyYAML",
    "scikit-learn",
    "pandas",
]
docs = [
    "zensical",
]
viz = [
    "matplotlib",
]
flows = [
    "zuko",
]
all = ["torchregress[test,docs,viz,flows]"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["torchregress*"]

[tool.setuptools.package-data]
torchregress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".pixi",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501", "W605"]
"docs/*" = ["E501", "W605"]
"tools/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ty.environment]
python = ".pixi/envs/default"
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.src]
exclude = [
    "**/viz/results.py",
    "**/test_time/transport.py",
    "**/losses/balanced_mse.py",
    "**/algorithms/rc.py",
]

# Torch/scipy stubs are incomplete; keep ty as a gate for real import/config
# failures without failing CI on inference noise during the mypy→ty migration.
[tool.ty.rules]
invalid-argument-type = "warn"
invalid-return-type = "warn"
missing-argument = "warn"
invalid-assignment = "warn"
unresolved-attribute = "warn"
invalid-method-override = "warn"
call-top-callable = "warn"
call-non-callable = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
redundant-cast = "ignore"
unused-type-ignore-comment = "ignore"

[[tool.ty.overrides]]
include = ["**/viz/**"]
[tool.ty.overrides.rules]
all = "ignore"
[tool.coverage.run]
branch = false
source = ["torchregress"]
omit = [
    "src/torchregress/__init__.py",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "\\.\\.\\.",
]
