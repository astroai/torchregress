[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress"
version = "0.1.0"
description = "PyTorch loss functions and utilities for regression problems."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "machine learning", "deep learning", "loss functions"]
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "torchmetrics",
    "scipy",
    "tqdm",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress"
"Bug Tracker" = "https://github.com/sfabbro/torchregress/issues"
"Documentation" = "https://sfabbro.github.io/torchregress/"

[project.scripts]
torchregress-health = "torchregress.health:check_health"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "polars",
    "pyarrow",
    "PyYAML",
    "scikit-learn",
    "pandas",
]
docs = [
    "zensical",
]
vos = [
    "vos",
]
flows = [
    "zuko",
]
all = ["torchregress[test,docs,flows]"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["torchregress*"]

[tool.setuptools.package-data]
torchregress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
"docs/*" = ["E501"]
"tools/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = ["examples", "tools", "docs", "scripts"]

[[tool.mypy.overrides]]
module = ["examples.*", "tools.*", "docs.*", "tests.*", "scripts.*", "torchregress.viz.results", "torchregress.test_time.transport", "torchregress.losses.balanced_mse", "torchregress.algorithms.rc", "torchregress.utils.scaling"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "torchregress.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "matplotlib.*",
    "torchmetrics.*",
    "scipy.*",
    "requests.*",
    "zuko.*",
    "tqdm.*",
    "numpy.*",
]
ignore_missing_imports = true

# pytest-cov configuration (consumed by `uv run pytest --cov=...` and Codecov).
# Mirrors the codecov.yml ignore list so local runs match CI reports.
[tool.coverage.run]
branch = false
source = ["torchregress"]
omit = [
    "src/torchregress/__init__.py",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]
