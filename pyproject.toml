[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress"
version = "0.2.0"
description = "Probabilistic and robust regression for PyTorch: losses, metrics, conformal prediction and calibration."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
keywords = [
    "pytorch",
    "regression",
    "uncertainty quantification",
    "conformal prediction",
    "probabilistic forecasting",
    "calibration",
    "robust regression",
    "loss functions",
]
# Floors track the newest releases the conda-forge pixi lock resolves
# (2026-10-05); raised for 0.3.0, see CHANGELOG.
dependencies = [
    "torch>=2.13",
    "numpy>=2.5",
    "torchmetrics>=1.9",
    "scipy>=1.18",
]

[project.urls]
"Homepage" = "https://github.com/astroai/torchregress"
"Bug Tracker" = "https://github.com/astroai/torchregress/issues"
"Documentation" = "https://astroai.github.io/torchregress/"
"Source" = "https://github.com/astroai/torchregress"
"Changelog" = "https://github.com/astroai/torchregress/blob/main/CHANGELOG.md"

[project.scripts]
torchregress-health = "torchregress.health:check_health"

[project.optional-dependencies]
test = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "polars>=1.43",
    "pyarrow>=25.0",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.9",
    "pandas>=3.0",
    "scoringrules>=0.11",
    "properscoring>=0.1",
    "hypothesis>=6.100",
]
docs = [
    "zensical>=0.0.52",
]
viz = [
    "matplotlib>=3.11",
]
flows = [
    "zuko>=1.6",
]
all = ["torchregress[test,docs,viz,flows]"]

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
include = ["torchregress*"]

[tool.setuptools.package-data]
torchregress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".pixi",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501", "W605"]
"docs/*" = ["E501", "W605"]
"tools/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ty.environment]
python = ".pixi/envs/default"
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.src]
exclude = []

# Torch/scipy stubs are incomplete; keep ty as a gate for real import/config
# failures without failing CI on inference noise during the mypy→ty migration.
[tool.ty.rules]
invalid-argument-type = "warn"
invalid-return-type = "warn"
missing-argument = "warn"
invalid-assignment = "warn"
unresolved-attribute = "warn"
invalid-method-override = "warn"
call-top-callable = "warn"
call-non-callable = "warn"
not-iterable = "warn"
not-subscriptable = "warn"
redundant-cast = "ignore"
unused-type-ignore-comment = "ignore"

[[tool.ty.overrides]]
include = ["**/viz/**"]
[tool.ty.overrides.rules]
all = "ignore"
[tool.coverage.run]
branch = false
source = ["torchregress"]
omit = [
    "src/torchregress/__init__.py",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "\\.\\.\\.",
]
