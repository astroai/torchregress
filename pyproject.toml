[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchregress"
version = "0.1.0"
description = "PyTorch loss functions and utilities for regression problems."
readme = "README.md"
authors = [
    {name = "Sébastien Fabbro", email = "sebfabbro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12, <3.16"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "regression", "machine learning", "deep learning", "loss functions"]
dependencies = [
    "torch>=2.4.0",
    "numpy>=2.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "torchmetrics>=1.4.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.urls]
"Homepage" = "https://github.com/sfabbro/torchregress"
"Bug Tracker" = "https://github.com/sfabbro/torchregress/issues"
"Documentation" = "https://github.com/sfabbro/torchregress#readme"

[project.scripts]
torchregress-health = "torchregress.health:check_health"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "polars>=0.20.0",
    "pyarrow>=18.0.0",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.7.0",
]
conformal = []
flows = [
    "zuko>=1.6.0",
]
clauds = [
    "polars>=0.20.0",
    "astropy>=6.0.0",
    "pyarrow>=18.0.0",
]
# TabReD fetch + wide-tabular probe (Polars/Kaggle/loguru align with yandex-research/tabred)
tabred = [
    "polars>=0.20.0",
    "pyarrow>=18.0.0",
    "kaggle>=1.6.0",
    "loguru>=0.7.0",
    "scikit-learn>=1.5.0",
]
foundation-models = [
    "tabpfn>=0.1.9",
]
all = ["torchregress[test,dev,docs,conformal,flows,foundation-models]"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["torchregress*"]

[tool.setuptools.package-data]
torchregress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.uv-cache
  | \.pytest_cache
  | \.ruff_cache
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".uv-cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
"docs/*" = ["E501"]
"tools/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = ["examples", "tools", "docs"]

[[tool.mypy.overrides]]
module = ["examples.*", "tools.*", "docs.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "torchregress.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "matplotlib.*",
    "pandas.*",
    "torchmetrics.*",
    "scipy.*",
    "sklearn.*",
    "requests.*",
    "zuko.*",
    "tqdm.*",
    "numpy.*",
]
ignore_missing_imports = true


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
pytorch = ">=2.4.0"
python = ">=3.12"
pip = "*"
ruff = ">=0.5.0"
black = ">=24.0.0"
mypy = ">=1.10.0"
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"

[tool.pixi.pypi-dependencies]
torchregress = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["all"], solve-group = "default" }
all = { features = ["all"], solve-group = "default" }
conformal = { features = ["conformal"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
flows = { features = ["flows"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
check = "bash pre-check.sh"
lint = "ruff check . && black --check ."
test = "pytest"
mypy = "mypy torchregress && mypy tests --explicit-package-bases"
examples-audit = "python tools/render_example_summaries.py --profile audit"
examples-full = "python tools/render_example_summaries.py --profile full"
examples-check = "python tools/render_example_summaries.py --profile audit && python tools/render_example_summaries.py --profile full"
