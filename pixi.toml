[workspace]
name = "torchregress"
version = "0.3.0b1"
description = "Probabilistic and robust regression for PyTorch: losses, metrics, conformal prediction and calibration."
authors = ["Sébastien Fabbro <sebfabbro@gmail.com>"]
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "osx-arm64",
  # GPU nodes (CANFAR): CUDA 12.9 driver, compute capability >= 8.0. Used by the cuda env.
  { name = "linux-64-cuda", platform = "linux-64", cuda = { driver = "12.9", arch = "8.0" } },
]

[dependencies]
python = ">=3.13.18,<3.14"
pytorch = ">=2.14.1,<3"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
torchmetrics = ">=1.9.0,<2"
matplotlib = ">=3.11.2,<4"
zuko = ">=1.6.0,<2"

[feature.dev.dependencies]
ruff = ">=0.17.2,<0.18"
ty = ">=0.0.92,<0.0.93"

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
polars = ">=2.1.0,<3"
pyarrow = ">=25.0.0,<26"
pyyaml = ">=6.0.3,<7"
scikit-learn = ">=1.9.1,<2"
pandas = ">=3.1.0,<4"
scoringrules = ">=0.11.0"
properscoring = ">=0.1"
statsmodels = ">=0.15.0,<0.16"
hypothesis = ">=6.170.11"

[feature.cuda]
platforms = ["linux-64-cuda"]

[feature.cuda.dependencies]
pytorch-gpu = ">=2.14.1,<3"

[feature.docs.pypi-dependencies]
zensical = ">=0.0.73, <0.0.74"

[feature.release.pypi-dependencies]
build = ">=1.6.1, <2"

[pypi-dependencies]
torchregress = { path = ".", editable = true }

[environments]
default = { features = ["dev", "test", "docs"], solve-group = "default" }
release = { features = ["dev", "test", "docs", "release"], solve-group = "default" }
# GPU test gate: pixi run -e cuda test-cuda (scripts/ci_cuda.sh)
cuda = { features = ["cuda", "dev", "test"], solve-group = "cuda" }

[tasks]
lint = { cmd = "ruff check src/torchregress tests tools && ruff format --check src/torchregress tests tools" }
format = "ruff format src/torchregress tests tools"
typecheck = "ty check --python .pixi/envs/default src/torchregress"
test = "pytest --cov=torchregress --cov-report=term --cov-report=xml"
test-cuda = "bash scripts/ci_cuda.sh"
docs = "zensical build --strict"
build = "python -m build"
ci = { depends-on = ["lint", "typecheck", "test", "docs"] }
